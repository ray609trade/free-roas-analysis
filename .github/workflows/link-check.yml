name: Link check

# Verifies every external URL in the knowledge base — state unclaimed property
# programs, federal registries, and recordkeeper lookup pages — still resolves.
#
# This exists because those links are the product. A dead or wrong official URL
# on a page about recovering someone's money is a credibility failure, and these
# targets change: states rebrand their programs, recordkeepers get acquired and
# redirect, agencies reorganise their sites.
#
# GitHub's runners have open network access, so this check works here even
# though it cannot run inside a restricted sandbox.
#
# Uses no external actions, for the same reason as qa.yml.

on:
  schedule:
    # Weekly, Monday 08:00 UTC. Government sites change slowly; weekly catches
    # a break before it costs meaningful traffic.
    - cron: "0 8 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "data/**"
      - "build/qa.js"

permissions:
  contents: read
  issues: write

jobs:
  links:
    name: Verify external URLs
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git -c protocol.version=2 fetch -q --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD

      - name: Check every external URL
        id: check
        run: |
          set -o pipefail
          node build/qa.js --links 2>&1 | tee link-report.txt
        continue-on-error: true

      - name: Summarise
        run: |
          {
            echo "## Link check"
            echo ""
            if grep -qE '^[[:space:]]+✗' link-report.txt; then
              echo "**Failing URLs:**"
              echo ""
              echo '```'
              grep -E '^[[:space:]]+✗' link-report.txt
              echo '```'
            else
              echo "All external URLs resolved."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update an issue if any URL is broken
        if: steps.check.outcome == 'failure'
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          failing=$(grep -E '^[[:space:]]+✗' link-report.txt || true)
          if [ -z "$failing" ]; then
            echo "Nothing to report."
            exit 0
          fi

          body=$(printf '%s\n' \
            "The scheduled link check found URLs that no longer resolve." \
            "These appear on live pages, so fix them in \`data/\` and rebuild." \
            "" \
            '```' \
            "$failing" \
            '```' \
            "" \
            "[View run](${SERVER}/${REPO}/actions/runs/${RUN_ID})" \
            "" \
            "---" \
            "_Generated by [Claude Code](https://claude.ai/code)_")

          # Reuse an existing open issue instead of filing a new one each week.
          existing=$(curl -sS -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues?state=open&labels=link-check" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);console.log(a.length?a[0].number:"")}catch(e){console.log("")}})')

          payload=$(node -e '
            const body = process.argv[1];
            process.stdout.write(JSON.stringify({
              title: "Broken external links in the knowledge base",
              body,
              labels: ["link-check"]
            }));
          ' "$body")

          if [ -n "$existing" ]; then
            echo "Commenting on existing issue #${existing}"
            comment=$(node -e 'process.stdout.write(JSON.stringify({body:process.argv[1]}))' "$body")
            curl -sS -X POST -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/issues/${existing}/comments" \
              -d "$comment" > /dev/null
          else
            echo "Opening a new issue"
            curl -sS -X POST -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/issues" \
              -d "$payload" > /dev/null
          fi

      - name: Fail the run if links are broken
        if: steps.check.outcome == 'failure'
        run: exit 1

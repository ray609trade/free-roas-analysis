<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b5d4a" />
  <title>Page not found — ReclaimWealth</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--green:#0b5d4a;--green-900:#052720;--gold:#e0b34a;--gold-lt:#f0d08a;--gold-dark:#c8992f;--cream:#cfe6de}
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px 22px;color:#fff;
      font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;
      background:
        radial-gradient(800px 380px at 80% -10%, rgba(224,179,74,.22), transparent 62%),
        linear-gradient(158deg,var(--green),var(--green-900));
    }
    .mark{
      width:58px;height:58px;border-radius:16px;margin:0 auto 26px;display:grid;place-items:center;
      background:linear-gradient(140deg,var(--gold-lt),var(--gold) 45%,var(--gold-dark));
      color:#3a2c05;font-weight:900;font-size:1.6rem;box-shadow:0 12px 30px -10px rgba(224,179,74,.9);
    }
    h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:clamp(1.9rem,5vw,2.8rem);margin:0 0 .3em;letter-spacing:-.02em}
    p{color:var(--cream);max-width:480px;margin:0 auto 30px}
    .btn{
      display:inline-flex;align-items:center;gap:.5rem;font-weight:700;padding:1rem 1.9rem;border-radius:999px;
      text-decoration:none;color:#3a2c05;background:linear-gradient(135deg,var(--gold-lt),var(--gold) 42%,var(--gold-dark));
      box-shadow:0 12px 28px -8px rgba(200,153,47,.7);transition:transform .18s ease,box-shadow .25s ease;
    }
    .btn:hover{transform:translateY(-2px);box-shadow:0 18px 36px -10px rgba(200,153,47,.85)}
    .links{margin-top:26px;font-size:.9rem}
    .links a{color:var(--cream);text-decoration:none;padding:0 10px;border-right:1px solid rgba(255,255,255,.2)}
    .links a:last-child{border:0}
    .links a:hover{color:#fff;text-decoration:underline}
  </style>
</head>
<body>
  <main>
    <div class="mark">R</div>
    <h1>This page went missing.</h1>
    <p>Unlike your old 401(k), though, we can't help you reclaim it. Head back to the search and let's go find the money that <em>is</em> yours.</p>
    <a class="btn" href="/">Start my free search →</a>
    <div class="links">
      <a href="/">Home</a><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a><a href="mailto:info@rmgcredit.com">Contact</a>
    </div>
  </main>
</body>
</html>

name: Link check

# Verifies every external URL in the knowledge base — state unclaimed property
# programs, federal registries, and recordkeeper lookup pages — still resolves.
#
# This exists because those links are the product. A dead or wrong official URL
# on a page about recovering someone's money is a credibility failure, and these
# targets change: states rebrand their programs, recordkeepers get acquired and
# redirect, agencies reorganise their sites.
#
# GitHub's runners have open network access, so this check works here even
# though it cannot run in a restricted sandbox.

on:
  schedule:
    # Weekly, Monday 08:00 UTC. Government sites change slowly; weekly is
    # frequent enough to catch a break before it costs much traffic.
    - cron: "0 8 * * 1"
  workflow_dispatch:
  push:
    # Also run whenever the URLs themselves change.
    paths:
      - "data/**"
      - "build/qa.js"

permissions:
  contents: read
  issues: write

jobs:
  links:
    name: Verify external URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check every external URL
        id: check
        run: |
          set -o pipefail
          node build/qa.js --links 2>&1 | tee link-report.txt
        continue-on-error: true

      - name: Summarise
        run: |
          {
            echo "## Link check"
            echo ""
            if grep -qE '^\s+✗' link-report.txt; then
              echo "**Failing URLs:**"
              echo ""
              echo '```'
              grep -E '^\s+✗' link-report.txt
              echo '```'
            else
              echo "All external URLs resolved."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue if any URL is broken
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('link-report.txt', 'utf8');
            const failing = report.split('\n').filter(l => /^\s+✗/.test(l));
            if (!failing.length) return;

            const title = 'Broken external links in the knowledge base';
            const body = [
              'The scheduled link check found URLs that no longer resolve.',
              'These appear on live pages, so fix them in `data/` and rebuild.',
              '',
              '```',
              ...failing,
              '```',
              '',
              `[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_'
            ].join('\n');

            // Reuse an existing open issue rather than filing a new one each week.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'link-check'
            });

            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['link-check']
              });
            }

      - name: Fail the run if links are broken
        if: steps.check.outcome == 'failure'
        run: exit 1
